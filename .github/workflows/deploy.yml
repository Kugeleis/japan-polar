name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install Dependencies 📦
        run: |
          cd web-app
          npm install

      - name: Copy Data to Public 📂
        run: |
          mkdir -p web-app/public/trip
          mkdir -p web-app/public/user
          cp -r trip/* web-app/public/trip/
          cp -r user/* web-app/public/user/

      - name: Generate Media Manifest 📑
        run: |
          cd web-app
          node scripts/generate-manifest.cjs

      - name: Build 🏗️
        run: |
          cd web-app
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-app/dist
          branch: gh-pages
